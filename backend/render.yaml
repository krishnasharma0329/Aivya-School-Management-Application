services:
  - type: web
    name: aivya-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: BOOTSTRAP_TEACHER_EMAIL
        value: teacher@aivya.edu
      - key: BOOTSTRAP_TEACHER_PASSWORD
        value: AivyaDemo@2026
      - key: BOOTSTRAP_TEACHER_NAME
        value: Demo Teacher
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /api/v1/health
