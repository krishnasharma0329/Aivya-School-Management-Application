spring.application.name=aivya-backend

# Local development database
spring.datasource.url=jdbc:h2:mem:aivya_dev
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Server configuration -- Render (and most hosts) inject PORT at runtime.
server.port=${PORT:8080}

# Health monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# JWT configuration
app.jwt.secret=${JWT_SECRET:QWl2eWEtU2Nob29sLU1hbmFnZW1lbnQtRGV2ZWxvcG1lbnQtS2V5LTIwMjY=}
app.jwt.expiration=86400000

# No default Spring user -- authentication is entirely JWT-based (see SecurityConfig).
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

